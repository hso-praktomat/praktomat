name: Run tests

on: [push, pull_request]

jobs:
  test:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      # without --checker-toolchains: the R/DejaGnu/C/CUnit/CppUnit checker tests are optional and skipped
      run: ./scripts/install-system-deps.sh
    - uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        miniconda-version: latest
        python-version: ${{ matrix.python-version }}
        activate-environment: test-environment
        add-pip-as-python-dependency: true
    - name: Conda info
      run: conda info -a
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt -r requirements-dev.txt
    - name: Conda list
      run: conda list
    - name: Pip freeze
      run: pip freeze
    - name: Display Python and SQLite version
      run: |
        python --version && python -c "import sqlite3; print(\"SQLite \" + sqlite3.sqlite_version);"
    - name: Create upload root directories
      run: |
        mkdir ../debug-data
        mkdir ../test-data
    - name: Create symlink for environment
      run: |
        # since praktomat.wsgi depends on existent path env/lib where env is sibling folder of praktomat folder
        ln -s $CONDA/envs/test-environment ../env
        ls -la --time-style=long-iso ..
    - name: Run checks and tests with coverage
      env:
        PYTHON: python
        # tests whose external tools are missing fail instead of being skipped
        PRAKTOMAT_REQUIRE_ALL_TOOLS: "1"
      run: ./scripts/check --full
