[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
extend-exclude = ["src/*/migrations/*"]

[tool.ruff.lint]
select = [
    "F",
    "E4", "E7", "E9", "W",
    "B",
    "BLE", "E722",
    "S102", "S103", "S108", "S301", "S307", "S602", "S604", "S605", "S606", "S608", "S701",
    "DJ",
    "UP",
    "I",
    "PLE",
    "T20",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"src/settings/*" = ["F403", "F405", "F821"]
"src/**/tests.py" = ["S", "T20"]
"src/hbrs_tests/*" = ["S", "T20"]
"src/**/management/commands/*" = ["T20"]

[tool.pyright]
include = ["src", "documentation/ExampleChecker.py"]
extraPaths = ["src"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
